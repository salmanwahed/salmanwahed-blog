[tool.ruff]
target-version = "py38"
line-length = 119

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "F401", "F811"]
"salmanwahed_com/salmanwahed_com/settings.py" = ["F401", "F403", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
